<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Carousel</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="carousel">
        <div class="slides" id="slides">
            <img class="slide" src="https://via.placeholder.com/300x150/ff7f7f" alt="Slide 1">
            <img class="slide" src="https://via.placeholder.com/300x150/7f7fff" alt="Slide 2">
            <img class="slide" src="https://via.placeholder.com/300x150/7fff7f" alt="Slide 3">
        </div>
        <div class="controls">
            <button id="prevBtn">Prev</button>
            <button id="nextBtn">Next</button>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
