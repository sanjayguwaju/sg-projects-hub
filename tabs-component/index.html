<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabs Component</title>
  <style>
    .tabs {
      display: flex;
    }
    .tabs button {
      padding: 10px;
      border: 1px solid #ccc;
      cursor: pointer;
    }
    .tab-content {
      display: none;
      padding: 10px;
      border: 1px solid #ccc;
      margin-top: 10px;
    }
    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="tabs">
    <button data-tab="1">Tab 1</button>
    <button data-tab="2">Tab 2</button>
    <button data-tab="3">Tab 3</button>
  </div>
  <div class="tab-content" id="tab-1">Content for Tab 1</div>
  <div class="tab-content" id="tab-2">Content for Tab 2</div>
  <div class="tab-content" id="tab-3">Content for Tab 3</div>

  <script>
    const buttons = document.querySelectorAll('.tabs button');
    const contents = document.querySelectorAll('.tab-content');

    buttons.forEach(button => {
      button.addEventListener('click', () => {
        const tabId = button.getAttribute('data-tab');
        contents.forEach(content => {
          content.classList.remove('active');
          if (content.id === `tab-${tabId}`) {
            content.classList.add('active');
          }
        });
      });
    });
  </script>

</body>
</html>
